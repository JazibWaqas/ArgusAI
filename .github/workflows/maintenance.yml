name: ArgusAI maintenance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate backend syntax
        run: python -m compileall backend/app agents/argusai_investigator
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check public frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 --retry-delay 10 --max-time 120 \
            https://argusai-frontend-1007754127412.us-central1.run.app/ >/dev/null
          curl --fail --show-error --silent --retry 2 --retry-delay 10 --max-time 120 \
            https://argusai-backend-1007754127412.us-central1.run.app/health >/tmp/health.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          assert health.get('status') == 'ok', health
          assert health.get('llm_provider_ready') == 'gemini', health
          print('Production health check passed.')
          PY

